resources:
  jobs:
    bakehouse_end_to_end_job:
      name: bakehouse_end_to_end_job
      max_concurrent_runs: 1
      performance_target: STANDARD
      schedule:
        quartz_cron_expression: 32 0 0 * * ?
        timezone_id: Asia/Calcutta
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${var.notification_email}
      tasks:
        - task_key: check_and_open_batch
          notebook_task:
            notebook_path: ../notebooks/open_close_batch.ipynb
            base_parameters:
              operation: open
              catalog: ${var.catalog}
              meta_schema: ${var.meta_schema}

        - task_key: dlt_pipeline
          depends_on:
            - task_key: check_and_open_batch
          pipeline_task:
            pipeline_id: ${resources.pipelines.pipeline_bakehouse_dlt.id}

        - task_key: dq_checks
          depends_on:
            - task_key: dlt_pipeline
          notebook_task:
            notebook_path: ../notebooks/dq_check.ipynb
            base_parameters:
              catalog: ${var.catalog}
              meta_schema: ${var.meta_schema}
              brz_schema: ${var.brz_schema}
              slv_schema: ${var.slv_schema}
              gld_schema: ${var.gld_schema}

        - task_key: close_batch
          depends_on:
            - task_key: dq_checks
          notebook_task:
            notebook_path: ../notebooks/open_close_batch.ipynb
            base_parameters:
              operation: close
              catalog: ${var.catalog}
              meta_schema: ${var.meta_schema}