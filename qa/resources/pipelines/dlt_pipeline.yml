resources:
  pipelines:
    pipeline_bakehouse_dlt:
      name: bakehouse_dlt_pipeline
      libraries:
        - glob:
            include: ../notebooks/dlt_files/**
      schema: ${var.brz_schema}
      continuous: false
      photon: true
      channel: CURRENT
      catalog: ${var.catalog}
      serverless: true
      root_path: ../notebooks/dlt_files
      configuration:
        bakeflow.catalog: ${var.catalog}
        bakeflow.brz_schema: ${var.brz_schema}
        bakeflow.slv_schema: ${var.slv_schema}
        bakeflow.gld_schema: ${var.gld_schema}
        bakeflow.meta_schema: ${var.meta_schema}
